<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Painel Administrativo | Pesquisa UFMG</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Montserrat', 'sans-serif'] },
        colors: { emerald: { 500: '#10b981', 600: '#059669' } },
      },
    },
  };
</script>

<style>
  html, body { max-width: 100%; overflow-x: hidden; }
  body { font-family: 'Inter', sans-serif; background: #04100c; }

  .glass-card {
    background: rgba(15, 23, 22, 0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(16, 185, 129, 0.18);
  }

  /* Sem transition proposital nesses toggles (bug já visto no modal do formulário:
     no Safari/iOS, transições de opacidade concorrendo com o Tailwind Play CDN
     travam a meio caminho e a tela some). Troca de tela é instantânea via [hidden].

     [hidden] sozinho NÃO bastaria aqui: #login-screen usa a classe `.flex`
     (display:flex), que tem a MESMA especificidade do `[hidden]{display:none}`
     do navegador — e como vem depois no cascade, a classe ganha e o elemento
     continua visível mesmo com o atributo hidden presente. Força explicitamente. */
  #login-screen[hidden], #dashboard-screen[hidden] { display: none; }

  .admin-input {
    background: #0b1a15;
    border: 1.5px solid #1f2e29;
    color: #f3f4f6;
  }
  .admin-input:focus { outline: none; border-color: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.16); }

  table { border-collapse: collapse; }
  th, td { text-align: left; vertical-align: top; }

  .stat-card {
    background: rgba(15, 23, 22, 0.55);
    border: 1px solid rgba(16, 185, 129, 0.18);
    border-radius: 14px;
  }

  pre.json-preview {
    max-height: 220px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
</style>
</head>

<body class="text-gray-100 antialiased min-h-screen">

  <!-- TELA DE LOGIN -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center px-4">
    <form id="login-form" class="glass-card rounded-2xl w-full max-w-sm p-8">
      <h1 class="font-display text-xl font-extrabold text-white">Painel Administrativo</h1>
      <p class="text-gray-400 text-sm mt-1">Acesso restrito — pesquisa UFMG</p>

      <label class="block mt-6 text-sm font-medium text-gray-300" for="password-input">Senha</label>
      <input
        id="password-input"
        type="password"
        autocomplete="current-password"
        class="admin-input w-full rounded-lg px-3.5 py-2.5 mt-1.5 text-sm"
        required
      >

      <div id="login-alert" hidden class="mt-3 text-sm text-red-400 bg-red-950/40 border border-red-900 rounded-lg px-3 py-2"></div>

      <button
        type="submit"
        id="login-submit"
        class="mt-5 w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm rounded-lg py-2.5 transition-colors"
      >
        Entrar
      </button>
    </form>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard-screen" hidden class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <div class="flex items-center justify-between flex-wrap gap-4">
      <div>
        <h1 class="font-display text-2xl font-extrabold text-white">Painel da Pesquisa</h1>
        <p class="text-gray-400 text-sm mt-1">Respostas do Formulário A (PPGIT/UFMG)</p>
      </div>
      <div class="flex items-center gap-3">
        <a
          href="/api/admin/export"
          class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm rounded-lg px-4 py-2.5 transition-colors"
        >
          Exportar para Excel
        </a>
        <button
          id="logout-btn"
          class="text-gray-400 hover:text-gray-200 text-sm font-medium border border-gray-700 rounded-lg px-4 py-2.5 transition-colors"
        >
          Sair
        </button>
      </div>
    </div>

    <!-- CARDS DE ESTATÍSTICAS -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mt-6">
      <div class="stat-card p-5">
        <p class="text-xs uppercase tracking-wide text-emerald-400 font-semibold">Total de Respostas</p>
        <p id="stat-total" class="font-display text-3xl font-extrabold text-white mt-2">—</p>
      </div>
      <div class="stat-card p-5">
        <p class="text-xs uppercase tracking-wide text-emerald-400 font-semibold">Últimas 24h</p>
        <p id="stat-24h" class="font-display text-3xl font-extrabold text-white mt-2">—</p>
      </div>
      <div class="stat-card p-5">
        <p class="text-xs uppercase tracking-wide text-emerald-400 font-semibold">Consentiram</p>
        <p id="stat-consent" class="font-display text-3xl font-extrabold text-white mt-2">—</p>
      </div>
      <div class="stat-card p-5">
        <p class="text-xs uppercase tracking-wide text-emerald-400 font-semibold">Última Resposta</p>
        <p id="stat-last" class="font-display text-base font-bold text-white mt-2 leading-snug">—</p>
      </div>
    </div>

    <!-- TABELA -->
    <div class="glass-card rounded-2xl mt-8 overflow-hidden">
      <div class="px-5 py-4 border-b border-white/10">
        <h2 class="font-display text-base font-bold text-white">Respostas recebidas</h2>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b border-white/10 text-gray-400 text-xs uppercase tracking-wide">
              <th class="px-5 py-3">#</th>
              <th class="px-5 py-3">Data/Hora</th>
              <th class="px-5 py-3">Consentimento</th>
              <th class="px-5 py-3">Respostas</th>
            </tr>
          </thead>
          <tbody id="responses-tbody">
            <tr><td class="px-5 py-4 text-gray-500" colspan="4">Carregando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const loginScreen = document.getElementById('login-screen');
    const dashboardScreen = document.getElementById('dashboard-screen');
    const loginForm = document.getElementById('login-form');
    const loginAlert = document.getElementById('login-alert');
    const loginSubmit = document.getElementById('login-submit');
    const logoutBtn = document.getElementById('logout-btn');

    function showLogin() {
      dashboardScreen.hidden = true;
      loginScreen.hidden = false;
    }

    function showDashboard() {
      loginScreen.hidden = true;
      dashboardScreen.hidden = false;
      loadStats();
      loadResponses();
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('pt-BR');
    }

    async function loadStats() {
      const res = await fetch('/api/admin/stats');
      if (res.status === 401) { showLogin(); return; }
      const data = await res.json();
      if (!data.ok) return;
      document.getElementById('stat-total').textContent = data.totalResponses;
      document.getElementById('stat-24h').textContent = data.last24h;
      document.getElementById('stat-consent').textContent = data.consentAgree;
      document.getElementById('stat-last').textContent = fmtDate(data.lastResponseAt);
    }

    async function loadResponses() {
      const tbody = document.getElementById('responses-tbody');
      const res = await fetch('/api/admin/responses');
      if (res.status === 401) { showLogin(); return; }
      const data = await res.json();
      if (!data.ok) return;

      if (data.responses.length === 0) {
        tbody.innerHTML = '<tr><td class="px-5 py-4 text-gray-500" colspan="4">Nenhuma resposta ainda.</td></tr>';
        return;
      }

      tbody.innerHTML = data.responses.map(function (r) {
        const consentLabel = r.consent === 'agree' ? 'Concordou' : (r.consent === 'disagree' ? 'Não concordou' : '—');
        const json = JSON.stringify(r.payload && r.payload.respostas, null, 2);
        return (
          '<tr class="border-b border-white/5 align-top">' +
          '<td class="px-5 py-3 text-gray-400">' + r.id + '</td>' +
          '<td class="px-5 py-3 text-gray-300 whitespace-nowrap">' + fmtDate(r.created_at) + '</td>' +
          '<td class="px-5 py-3 text-gray-300">' + consentLabel + '</td>' +
          '<td class="px-5 py-3"><pre class="json-preview text-xs text-gray-400 bg-black/20 rounded-lg p-3">' +
            json.replace(/&/g, '&amp;').replace(/</g, '&lt;') +
          '</pre></td>' +
          '</tr>'
        );
      }).join('');
    }

    loginForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      loginAlert.hidden = true;
      loginSubmit.disabled = true;
      loginSubmit.textContent = 'Entrando…';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password-input').value }),
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          document.getElementById('password-input').value = '';
          showDashboard();
        } else {
          loginAlert.textContent = data.message || 'Não foi possível entrar. Tente novamente.';
          loginAlert.hidden = false;
        }
      } catch (err) {
        loginAlert.textContent = 'Erro de conexão. Tente novamente.';
        loginAlert.hidden = false;
      } finally {
        loginSubmit.disabled = false;
        loginSubmit.textContent = 'Entrar';
      }
    });

    logoutBtn.addEventListener('click', async function () {
      await fetch('/api/admin/logout', { method: 'POST' });
      showLogin();
    });

    // Se já existe uma sessão válida (cookie), pula direto pro dashboard.
    (async function init() {
      const res = await fetch('/api/admin/stats');
      if (res.ok) { showDashboard(); } else { showLogin(); }
    })();
  </script>

</body>
</html>
